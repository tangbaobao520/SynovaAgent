name: CI �� SynovaAgent

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: TypeScript + Lint + Iron Laws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # D515 项7: 纯文档 PR 的 CI 瘦身 — 全部变更为 md/json/task-state/.claude 时
      # 跳过 TS+Iron Laws 重检查（只跳 job 内步骤，不跳 job——PR 状态仍可读）。
      # Secrets 由独立 job 扫描，不受影响。混合 PR 正常全量。
      # 注: main push 合并后 diff 为空 → 按纯文档跳过（PR 门已验证，避免空跑）。
      - name: Detect docs-only change (D515)
        id: docsonly
        run: |
          if git diff --name-only origin/main...HEAD | grep -qvE '\.(md|json)$|task-state/|\.claude/'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
        if: steps.docsonly.outputs.docs_only != 'true'
      - run: npm ci
        if: steps.docsonly.outputs.docs_only != 'true'
      - name: TypeScript check
        if: steps.docsonly.outputs.docs_only != 'true'
        # K3 审计 P1-1 修复：去掉 `|| true` fail-open（CI 类型检查永不红 → 挪 CI 后类型防线真空）。
        # 过滤存量白名单（_extinct 退役哨兵死代码 + ima.ts/server.ts 已知错误 + 4 个历史文件），
        # 其余新类型错误 → exit 1 阻断。存量清理后逐步收紧白名单。
        run: |
          ERRORS=$(npx tsc --noEmit --pretty false 2>&1 | grep -v "_extinct/\|ima.ts\|server.ts\|sentinel-service.ts\|industry-loader.ts\|tool-registration.ts\|llm-provider-loader.ts" | grep -E "error TS" || true)
          if [ -n "$ERRORS" ]; then
            echo "$ERRORS"
            exit 1
          fi
      - name: Iron laws check
        if: steps.docsonly.outputs.docs_only != 'true'
        run: bash scripts/pre-commit-check.sh
        env:
          SYNO_DIFF_BASE: "origin/main"
          SYNO_CI: "1"  # D516/K3 P0-1: CI strict——本地 V5 软提示在 CI 转硬（权威物理落地）
      # D540: verify-parallel 已从本地 pre-push 移 CI/PR —— CI 权威物理拦截写集重叠
      #   base..HEAD write set vs origin/main 已合 dev doc write set（fetch-depth:0 需完整历史，已确认）
      #   纯文档 PR 跳过；混合 PR 正常跑。
      - name: Verify parallel declaration (D540, moved from local pre-push)
        if: steps.docsonly.outputs.docs_only != 'true'
        run: |
          # base..head 写集 × 已合 PR 写集 —— CI 权威物理拦截写集重叠
          bash scripts/control-tower/verify-parallel.sh --ci-pr origin/main

  test:
    name: Vitest (${{ matrix.shard }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Run tests
        env:
          NO_COLOR: "1"
        run: |
          CHANGED=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || git diff --name-only origin/main..HEAD 2>/dev/null || echo "")
          OUTPUT=$(npx vitest run --shard=${{ matrix.shard }} --reporter=verbose 2>&1; echo "EXIT:$?")
          echo "$OUTPUT"
          EXIT_CODE=$(echo "$OUTPUT" | grep "EXIT:" | sed 's/.*EXIT://')
          if [ "$EXIT_CODE" = "0" ]; then exit 0; fi
          # 去除 ANSI 颜色码后提取失败文件列表
          CLEAN_OUTPUT=$(echo "$OUTPUT" | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g')
          FAILED_TESTS=$(echo "$CLEAN_OUTPUT" | grep " FAIL " | grep -oP 'tests/\S+\.test\.ts' || true)
          if [ -n "$FAILED_TESTS" ] && [ -n "$CHANGED" ]; then
            NEW_FAILURES=""
            while IFS= read -r tf; do
              SOURCE_FILE=$(echo "$tf" | sed 's|^tests/|src/|; s|\.test\.ts|.ts|' | sed 's|-sentinel||' || true)
              if echo "$CHANGED" | grep -qF "$SOURCE_FILE" 2>/dev/null || echo "$CHANGED" | grep -qF "$tf" 2>/dev/null; then
                NEW_FAILURES="${NEW_FAILURES}${tf}\n"
              fi
            done <<< "$FAILED_TESTS"
            if [ -z "$NEW_FAILURES" ]; then
              echo "Pre-existing test failures from unchanged files �� not blocking"
              exit 0
            fi
          fi
          exit 1

  architecture:
    name: Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Layer boundary check
        run: bash scripts/check-architecture.sh
      - name: GraphStore compatibility
        run: npx vitest run tests/architecture/

  

  control-tower-tests:
    name: Control Tower Gate Tests (${{ matrix.os }})
    # D520/任务2: 双平台矩阵——平台问题（CRLF/python3/路径）不再等 Win 实测暴露。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # D520: verify-parallel 豁免逻辑依赖 origin/main ref（depth=1 时缺失→误红）
      - name: Run hermetic control-tower gate tests
        shell: bash
        # 密封测试扩容（D520）：原 5 个（U2/U4/U5a/U5c/U7）+ D515/D520 新增的
        # mktemp/注入缝密封测试。其余测试依赖 git 历史/运行时数据，非密封，
        # 全量密封化是单独立项（K3 P2-4）。此 job 是"门禁坏了能抓到"的 canary。
        run: |
          FAIL=0
          for t in \
            tests/control-tower/verify-parallel.test.sh \
            tests/control-tower/verify-claims-table.test.sh \
            tests/control-tower/write-set-check.test.sh \
            tests/control-tower/post-commit-marker.test.sh \
            tests/control-tower/ct-test-gate.test.sh \
            tests/control-tower/task-start-parallel.test.sh \
            tests/control-tower/fastlane-bypass-only.test.sh \
            tests/control-tower/gate-stats.test.sh \
            tests/control-tower/q2-error-locating.test.sh \
            tests/control-tower/platform-checklist.test.sh \
            tests/control-tower/tag-ancestry.test.sh \
            tests/control-tower/brief-parser-strip.test.sh \
            tests/control-tower/post-commit.test.sh \
            tests/control-tower/simulate-ci.test.sh \
            tests/control-tower/synova-submit.test.sh \
            tests/control-tower/synova-commit.test.sh \
            tests/control-tower/parallel-main-tree-occupancy.test.sh \
            tests/control-tower/fastlane-extended.test.sh \
            tests/control-tower/check-canary-drift.test.sh; do
            echo "── $t"
            # D526: 测试失败输出进 ::error 注解——无 token 也能经 annotations 定位（D521 工具1 语义）
            if ! bash "$t" > /tmp/ct-out.log 2>&1; then
              echo "FAIL: $t"
              MSG=$(tail -8 /tmp/ct-out.log | tr '\n' '|' | tr -d '%' | cut -c1-450)
              echo "::error title=$t::$MSG"
              FAIL=1
            fi
          done
          # D526: canary 密封清单漂移告警（::warning 可见，不阻断——防误伤；
          #   存量漂移由 K3/人工月度清理，全量密封化是 K3 P2-4 单独立项）
          bash scripts/control-tower/check-canary-drift.sh || true
          exit $FAIL

  integration-check:
    name: Integration Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: L1+L2 integration checks
        run: bash scripts/workflow/check-integration.sh

  checker-review:
    name: Checker Review (maker/checker)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feat/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Run checker review
        run: bash scripts/checker-review.sh
      - name: Brief vs Code consistency
        run: bash scripts/workflow/check-brief-vs-code.sh --strict || true

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    # 2026-08-16 创始人裁决豁免（台账登记）：33 漏洞（32 high/1 critical）在 node-gyp
    # 编译链，非产品运行时；Synova 本地部署，攻击面不成立。豁免登记备案，
    # 触发升级条件 = 上云/公网化。CI 保留扫描（黄灯），失败不阻断合并。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --audit-level=high || echo "npm audit 已豁免 (2026-08-16 创始人裁决, 见台账)"

  golden-case:
    name: Golden Case F1 Gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Run golden case F1 gate
        run: npx tsx scripts/ci/golden-case-checker.ts
      - name: Run diagnosis quality check
        run: bash scripts/ci/diagnosis-quality-check.sh