name: CI — SynovaAgent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: TypeScript + Lint + Iron Laws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Iron laws check
        run: bash scripts/pre-commit-check.sh

  test:
    name: Vitest (${{ matrix.shard }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Run tests
        run: npx vitest run --shard=${{ matrix.shard }} --reporter=verbose

  architecture:
    name: Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Layer boundary check
        run: bash scripts/check-architecture.sh
      - name: GraphStore compatibility
        run: npx vitest run tests/architecture/

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --audit-level=high
