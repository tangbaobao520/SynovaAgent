# dashboard-auto.yml — 创始人控制台自动生成（D439 后接线）
#
# 背景: 2026-08-17 创始人 — 控制台右边栏"老样子"，根因 = generate-dashboard.py / founder-truth.py
#       是手动生成快照，无自动触发（M3 机制建成未接线）。
#
# 触发: push 到 main（= 数据变化事件）+ 手动 workflow_dispatch
# 产出: app/founder-dashboard.html + docs/synova/founder-console.html
# D786 通道设计 (b，2026-09-16): 产物有变化 → 只提交 bot 分支 auto/dashboard（force push），
#       **不再开 PR**——GITHUB_TOKEN 创建的 PR 不触发任何 workflow，必需检查永不报告 =
#       永久 blocked（#403 实证）。合并由 CTO session 用 PAT 显式开 PR + CI 全绿 + API 合并。
#       链路文档: docs/synova/coordination/CI-诊断通道.md。无变化 → 什么都不做（幂等）。
#
# 红线: 只调用 scripts/control-tower/ 的生成器（Harness 代码，进审计范围）；
#       不触碰 scripts/audit/、不写审计标准。
# founder-truth 用 --offline（跳过 CI API 调用——避免 workflow 内自调用 GitHub API 的死循环，
#        且 CI token 权限不足时降级）。generate-dashboard 纯本地无外部依赖。

name: Dashboard Auto (D439)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成创始人仪表盘（六维物理核验）
        run: |
          git config user.name "synova-bot"
          git config user.email "bot@synova.local"
          python3 scripts/control-tower/generate-dashboard.py --output app/founder-dashboard.html

      - name: 生成创始人零信任控制台（三问面板，--offline 跳过 CI 网络）
        run: |
          python3 scripts/control-tower/founder-truth.py --html --offline || {
            echo "⚠ founder-truth 降级（生成失败不阻断——离线模式无网络依赖，见 stderr）" >&2
          }
          # 重新生成后强制更新工作区（生成器可能写时间戳快照）
          git add app/founder-dashboard.html docs/synova/founder-console.html
          git diff --cached --quiet || echo "有产物变化，准备提交"

      - name: 产物有变化则提交 bot 分支（D786 通道设计 b：不开 PR）
        run: |
          git config user.name "synova-bot"
          git config user.email "bot@synova.local"
          # 基于 origin/main 开分支（不依赖 checkout 时的 HEAD，防 detached 问题）
          git fetch origin main
          if git diff --quiet origin/main -- app/founder-dashboard.html docs/synova/founder-console.html; then
            echo "无变化，跳过（幂等）"
            exit 0
          fi
          git checkout -B auto/dashboard origin/main
          git add app/founder-dashboard.html docs/synova/founder-console.html
          git commit -m "chore(D439): 控制台自动更新 $(date -u +%Y-%m-%d)"
          git push origin auto/dashboard --force
          echo ""
          echo "📌 D786 通道设计 (b)：bot 分支已推——GITHUB_TOKEN 创建的 PR 不触发任何 workflow，"
          echo "   必需检查永不报告 = 永久 blocked（#403 实证，2026-09-07~16）。"
          echo "   后续由 CTO session 显式完成（链路文档 docs/synova/coordination/CI-诊断通道.md）:"
          echo "   1) 用 PAT 从 auto/dashboard 开 PR（真实凭据 → 必需检查正常报告）"
          echo "   2) CI 全绿后 API squash 合并（合并是 CTO 的工作，D570）"
