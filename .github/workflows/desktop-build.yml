# D517: 桌面端安装包 CI 构建（验证点 1-1——安装包产出可复现，任何人可下载验证）
# 契约: push main / workflow_dispatch 触发；按 build-synova.cjs 头注释构建链三步顺序执行；
#       各平台原生构建（不做 linux 交叉）；CI 无 GUI → 只构建不启动（启动实测归 D519 本机）；
#       产物缺失 → 步骤 fail（exit 非 0 即红）。
# D529: ①所有含 bash 语法（test/compgen）的步骤显式 shell: bash——Windows runner 默认 pwsh，
#         `test -f` 在 pwsh 是 CommandNotFound 必红（PR #175 只修了 distutils 没修这个）。
#       ②fix/d529-* 分支也触发（修复迭代期拿新鲜日志——旧日志 BlobNotFound）。
#       ③失败时错误尾部走双通道回传：REST API commit 到 ci-debug/ + ::error:: 注解
#         （check-runs 注解 API 公开可读——本地无 gh/token 的 session 不猜根因）。
name: desktop-build

on:
  push:
    branches: [main, 'fix/d529-**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos (dmg + zip)
            os: macos-latest
            builder-args: '--mac'
          - name: windows (nsis)
            os: windows-latest
            builder-args: '--win'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # D529: node 20 (ABI 115) 无 better-sqlite3 v12 预编译（只发 ABI 127+）→ 回退 node-gyp
          # 源码编译 → runner VS 18 与 node-gyp 9.4.1 不兼容必红。node 22 = ABI 127 ✓ 预编译直达。
          node-version: 22

      # node-gyp 9.4.1 编译 better-sqlite3 需要 stdlib distutils（实证：Python 3.12.10 也已无 distutils，仅 3.11 及更早原生含 → 固定 3.11）
      - name: Setup Python 3.11 (node-gyp distutils compat)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 构建链步骤1: 后端单文件 bundle → dist/backend.mjs（prod 入口；tsc 独立门禁不在打包链）
      - name: Build backend (esbuild bundle)
        shell: bash
        run: |
          set -o pipefail
          { npm ci && npm run build:backend && test -f dist/backend.mjs; } 2>&1 | tee step-backend.log
          test ${PIPESTATUS[0]} -eq 0

      # 构建链步骤2: renderer vite → dist/renderer（首诊 UI）
      - name: Build renderer (vite)
        shell: bash
        working-directory: electron-renderer
        run: |
          set -o pipefail
          { npm ci && npm run build && test -f ../dist/renderer/index.html; } 2>&1 | tee ../step-renderer.log
          test ${PIPESTATUS[0]} -eq 0

      # 构建链步骤3: electron-builder → release/
      # D529: windows-latest 已切 VS 2026 (18)，npm 捆绑 node-gyp 9.4.1 无法识别 → bcrypt 6.0.0
      # 无预编译资产（release 0 assets）必走源码编译 → VS 识别失败。node-gyp@12 支持 VS2026
      # （nodejs/node-gyp#3228）。--no-save 不改 package.json。
      - name: Build installer (electron-builder)
        shell: bash
        run: |
          set -o pipefail
          npm i --no-save node-gyp@12
          npx electron-builder --config build-synova.cjs ${{ matrix.builder-args }} 2>&1 | tee step-installer.log
          test ${PIPESTATUS[0]} -eq 0

      # D529 debug: 失败根因回传（REST API commit 到 ci-debug/ + 注解；本步零失败化——不掩盖构建红）
      - name: Capture failure log (debug, remove after root cause fixed)
        if: failure()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          LOG="ci-debug/${RUNNER_OS,,}-${GITHUB_RUN_ID}.log"
          mkdir -p ci-debug
          { echo "run=${GITHUB_RUN_ID} job=${RUNNER_OS} ref=${GITHUB_REF_NAME}";
            for f in step-backend.log step-renderer.log step-installer.log; do
              echo; echo "════════ $f (tail 200) ════════";
              [ -f "$f" ] && tail -200 "$f" || echo "(missing)"
            done; } > "$LOG"
          # 通道1: 注解（check-runs API 公开可读；上限 10 条——按诊断价值排序: installer 优先）
          tail -5 step-installer.log 2>/dev/null | while IFS= read -r line; do echo "::error::${RUNNER_OS}/installer: ${line:0:230}"; done
          grep -iE "error|failed|fatal|not found|ERR_" step-backend.log step-renderer.log 2>/dev/null | tail -3 | while IFS= read -r line; do
            echo "::error::${RUNNER_OS}: ${line:0:240}"
          done
          # 通道2: REST API commit（绕开 git 客户端环境差异；失败时把响应体也打进注解）
          B64=$(base64 -w0 "$LOG" 2>/dev/null || base64 < "$LOG" | tr -d '\n')
          HTTP=$(curl -s -o /tmp/ci-debug-resp.json -w "%{http_code}" -X PUT \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${LOG}" \
            -d "{\"message\":\"ci-debug: ${RUNNER_OS} failure run ${GITHUB_RUN_ID}\",\"content\":\"${B64}\",\"branch\":\"${GITHUB_REF_NAME}\"}")
          if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then echo "ci-debug committed (HTTP $HTTP)"
          else echo "::error::ci-debug commit HTTP $HTTP: $(head -c 300 /tmp/ci-debug-resp.json)"; fi
          exit 0

      - name: Assert artifacts exist
        shell: bash
        run: |
          ls -lh release/
          if [ "${{ runner.os }}" = "macOS" ]; then
            compgen -G "release/*.dmg" > /dev/null || { echo "::error::no dmg produced"; exit 1; }
            compgen -G "release/*-mac*.zip" > /dev/null || { echo "::error::no mac zip produced"; exit 1; }
          else
            compgen -G "release/*.exe" > /dev/null || { echo "::error::no exe produced"; exit 1; }
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: synova-desktop-${{ runner.os }}-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
