# D517: 桌面端安装包 CI 构建（验证点 1-1——安装包产出可复现，任何人可下载验证）
# 契约: push main / workflow_dispatch 触发；按 build-synova.cjs 头注释构建链三步顺序执行；
#       各平台原生构建（不做 linux 交叉）；CI 无 GUI → 只构建不启动（启动实测归 D519 本机）；
#       产物缺失 → 步骤 fail（exit 非 0 即红）。
# D529: ①所有含 bash 语法（test/compgen）的步骤显式 shell: bash——Windows runner 默认 pwsh，
#         `test -f` 在 pwsh 是 CommandNotFound 必红（PR #175 只修了 distutils 没修这个）。
#       ②fix/d529-* 分支也触发（修复迭代期拿新鲜日志——旧日志 BlobNotFound）。
#       ③失败时把错误尾部 commit 回 ci-debug/（无 gh CLI 的本地 session 可读根因，不猜）。
name: desktop-build

on:
  push:
    branches: [main, 'fix/d529-**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos (dmg + zip)
            os: macos-latest
            builder-args: '--mac'
          - name: windows (nsis)
            os: windows-latest
            builder-args: '--win'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # node-gyp 9.4.1 编译 better-sqlite3 需要 stdlib distutils（实证：Python 3.12.10 也已无 distutils，仅 3.11 及更早原生含 → 固定 3.11）
      - name: Setup Python 3.11 (node-gyp distutils compat)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 构建链步骤1: 后端单文件 bundle → dist/backend.mjs（prod 入口；tsc 独立门禁不在打包链）
      - name: Build backend (esbuild bundle)
        shell: bash
        run: |
          npm ci
          npm run build:backend
          test -f dist/backend.mjs

      # 构建链步骤2: renderer vite → dist/renderer（首诊 UI）
      - name: Build renderer (vite)
        shell: bash
        working-directory: electron-renderer
        run: |
          npm ci
          npm run build
          test -f ../dist/renderer/index.html

      # 构建链步骤3: electron-builder → release/
      - name: Build installer (electron-builder)
        shell: bash
        run: npx electron-builder --config build-synova.cjs ${{ matrix.builder-args }} 2>&1 | tee build-installer.log; test ${PIPESTATUS[0]:-0} -eq 0

      # D529 debug: 失败时把构建日志尾部 commit 回 ci-debug/<platform>-<run>.log（定位根因用，移除于终态）
      - name: Capture failure log (debug, remove after root cause fixed)
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-debug
          { echo "run=${GITHUB_RUN_ID} job=${RUNNER_OS}"; tail -c 60000 build-installer.log 2>/dev/null || echo "(no build-installer.log)"; } > "ci-debug/${RUNNER_OS,,}-${GITHUB_RUN_ID}.log"
          git config user.name "ci-debug" && git config user.email "ci-debug@users.noreply.github.com"
          git add ci-debug/ && git commit -m "ci-debug: ${RUNNER_OS} failure log run ${GITHUB_RUN_ID}" || echo "nothing to commit"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert artifacts exist
        shell: bash
        run: |
          ls -lh release/
          if [ "${{ runner.os }}" = "macOS" ]; then
            compgen -G "release/*.dmg" > /dev/null || { echo "::error::no dmg produced"; exit 1; }
            compgen -G "release/*-mac*.zip" > /dev/null || { echo "::error::no mac zip produced"; exit 1; }
          else
            compgen -G "release/*.exe" > /dev/null || { echo "::error::no exe produced"; exit 1; }
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: synova-desktop-${{ runner.os }}-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
