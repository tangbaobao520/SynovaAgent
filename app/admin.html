<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synova — Admin Workbench</title>
  <link rel="stylesheet" href="/app/css/app.css">
  <link rel="stylesheet" href="/app/css/admin.css">
</head>
<body>
  <header id="synova-shell"></header>
  <div id="toast-container"></div>

  <div class="page-content">
    <div class="admin-header">
      <h1>Admin Workbench</h1>
      <span id="last-refresh" class="last-refresh"></span>
    </div>

    <!-- Tab Navigation -->
    <div class="tab-nav" id="tab-nav">
      <button class="tab-btn active" data-tab="enterprise">Enterprise</button>
      <button class="tab-btn" data-tab="members">Members</button>
      <button class="tab-btn" data-tab="invitations">Invitations</button>
      <button class="tab-btn" data-tab="ima">ima Integration</button>
      <button class="tab-btn" data-tab="ga-access">GA Access</button>
    </div>

    <!-- Tab: Enterprise -->
    <section id="tab-enterprise" class="tab-content active">
      <div class="card">
        <h2 class="card-title">Enterprise Information</h2>
        <div id="enterprise-status" class="skeleton-pulse" style="height:120px;"></div>
        <form id="enterprise-register-form" class="admin-form">
          <h3>Register Enterprise</h3>
          <div class="form-group"><label>Organization Name</label><input type="text" id="reg-org-name" required placeholder="Acme Corp"></div>
          <div class="form-group"><label>Admin Email</label><input type="email" id="reg-email" required placeholder="admin@acme.com"></div>
          <div class="form-group"><label>Admin Password</label><input type="password" id="reg-password" required minlength="6"></div>
          <button type="submit" class="btn-primary">Register</button>
        </form>
      </div>
    </section>

    <!-- Tab: Members -->
    <section id="tab-members" class="tab-content">
      <div class="card">
        <h2 class="card-title">Members</h2>
        <div id="members-list" class="skeleton-pulse" style="height:200px;"></div>
        <form id="invite-form" class="admin-form">
          <h3>Invite Member</h3>
          <div class="form-group"><label>Email</label><input type="email" id="invite-email" required></div>
          <div class="form-group"><label>Role</label><select id="invite-role"><option value="staff">Staff</option><option value="manager">Manager</option><option value="liaison">Liaison</option></select></div>
          <button type="submit" class="btn-primary">Send Invitation</button>
        </form>
      </div>
    </section>

    <!-- Tab: Invitations -->
    <section id="tab-invitations" class="tab-content">
      <div class="card">
        <h2 class="card-title">Pending Invitations</h2>
        <div id="invitations-list" class="skeleton-pulse" style="height:150px;"></div>
      </div>
    </section>

    <!-- Tab: ima -->
    <section id="tab-ima" class="tab-content">
      <div class="card">
        <h2 class="card-title">ima Integration</h2>
        <div id="ima-status" class="skeleton-pulse" style="height:80px;"></div>
        <form id="ima-bind-form" class="admin-form">
          <h3>Bind ima API Key</h3>
          <div class="form-group"><label>API Key</label><input type="password" id="ima-api-key" required minlength="8" placeholder="Enter your ima API key"></div>
          <button type="submit" class="btn-primary">Bind</button>
        </form>
      </div>
    </section>

    <!-- Tab: GA Access -->
    <section id="tab-ga-access" class="tab-content">
      <div class="card">
        <h2 class="card-title">GA Temporary Access</h2>
        <p class="text-secondary mb-16">Generate temporary access links for Growth Architects to view enterprise data.</p>
        <button id="btn-generate-ga" class="btn-primary" style="width:auto;padding:10px 20px;margin-bottom:16px;">Generate New Token</button>
        <div id="ga-tokens-list" class="skeleton-pulse" style="height:100px;"></div>
      </div>
    </section>
  </div>

  <script src="/app/js/auth.js"></script>
  <script src="/app/js/api-client.js"></script>
  <script src="/app/js/shell.js"></script>
  <script src="/app/js/admin.js"></script>
</body>
</html>
