<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synova — Setup</title>
  <link rel="stylesheet" href="/app/css/app.css">
  <link rel="stylesheet" href="/app/css/setup.css">
</head>
<body>
  <div class="setup-container">
    <div class="setup-progress" id="setup-progress">
      <div class="sp-step active" data-step="1"><span class="sp-num">1</span> Welcome</div>
      <div class="sp-step" data-step="2"><span class="sp-num">2</span> Configure</div>
      <div class="sp-step" data-step="3"><span class="sp-num">3</span> Test</div>
      <div class="sp-step" data-step="4"><span class="sp-num">4</span> Done</div>
    </div>
    <div class="setup-content" id="setup-content"></div>
  </div>
  <script src="/app/js/setup.js"></script>
</body>
</html>
