# SynovaAgent — Docker Compose 一键部署
# 方案 B: 客户有 Docker Desktop 或你帮客户部署
#
# 启动: docker compose up -d
# 停止: docker compose down
# 日志: docker compose logs -f

version: "3.8"

services:
  synova-agent:
    build: .
    container_name: synova-agent
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - synova-data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEV_MODE=false
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - SYNOVA_DB_PATH=/app/data/synova.db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  synova-data:
    driver: local
