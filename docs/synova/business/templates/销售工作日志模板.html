<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>哇呢宝贝销售工作日志（简化版）</title>
<style>
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;max-width:600px;margin:40px auto;padding:20px;background:#f5f5f5}
h1{text-align:center;color:#333;font-size:16px;border-bottom:2px solid #e74c3c;padding-bottom:8px;margin-bottom:16px}
.section{margin:12px 0;background:#fff;border-radius:6px;padding:14px 18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.section-title{font-weight:600;color:#e74c3c;font-size:13px;margin-bottom:8px}
.row{display:flex;align-items:center;margin:4px 0;font-size:13px;line-height:1.8}
.row label{width:140px;color:#666;flex-shrink:0;font-size:12px}
.field{display:inline-block;border-bottom:1px solid #999;min-width:80px;padding:0 4px}
.hint{color:#aaa;font-size:11px;margin-left:6px}
.highlight-box{background:#fff8e1;border:1px dashed #ffc107;border-radius:4px;padding:8px;font-size:12px;min-height:36px;color:#856404;margin-top:4px}
.note{text-align:center;color:#bbb;font-size:10px;margin-top:16px}
.time-estimate{text-align:right;font-size:10px;color:#999;margin-bottom:4px}
</style>
</head>
<body>

<h1>工作日志 · 每日 3 分钟</h1>
<p style="text-align:right;font-size:11px;color:#999;margin-top:-10px">汇报日期：2026 年 7 月 __ 日 | 姓名：______ | 团队：______</p>

<div class="section">
<div class="section-title">一、今天数字</div>
<div class="row"><label>今日业绩目标：</label><span class="field">&nbsp;</span> 元 <span class="hint">→</span> 实际完成 <span class="field">&nbsp;</span> 元</div>
<div class="row"><label>今日拜访客户数：</label><span class="field">&nbsp;</span> 人</div>
</div>

<div class="section">
<div class="section-title">二、今天有需要升级的问题吗？</div>
<div class="row"><label>☐ 没有，一切顺利</label></div>
<div class="row"><label>☐ 有（简述）：</label></div>
<div class="highlight-box"></div>
<p style="font-size:11px;color:#999;margin:4px 0 0">有需要公司支持的问题就写，没有就勾"没有"——不要为了填而填。</p>
</div>

<div class="section">
<div class="section-title">三、今天学到的一个可分享的点</div>
<p style="font-size:11px;color:#999;margin:0 0 4px">今天遇到的一个客户反应、一个话术调整、一个成交技巧——什么都行，一句话也可以。</p>
<div class="highlight-box"></div>
</div>

<div class="note">哇呢宝贝 · 销售工作日志 v2.0（简化版） | 每天3分钟，只写最重要的三件事</div>

</body>
</html>
