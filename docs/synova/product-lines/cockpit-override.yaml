# cockpit-override.yaml — 待裁决清单（A8 源，手动区）
#
# 用途: 页面顶部"需要创始人"置顶区的内容。每项必须自带选项 + 建议 + 一句话理由
#       （对齐 K3 原则：只出分析不替创始人决策——但建议必须给）。
# 维护: DeepSeek Harness 起草；创始人裁决后把 status 改为 resolved 并填 resolved_date。
#       改完跑 bash scripts/product-lines/refresh-all.sh 页面即时生效。

version: 1.0

pending_decisions:
  - id: "D-1"
    title: "告警去重窗口用多久？（同一件事多久内只提醒一次）"
    context: "审计员发现告警去重键不稳定（先修键是技术活，已排任务）。窗口大小是产品决策：太长会漏掉重要变化，太短会反复打扰老板。"
    options:
      - label: "5 分钟"
        note: "同一异常 5 分钟内只提醒一次；周级监测节奏下足够"
      - label: "30 分钟"
        note: "更安静，但半小时内的两次独立异常会合并"
    suggestion:
      label: "5 分钟"
      reason: "监测最细是周级，重复告警都发生在同一轮；5 分钟足够去重，且不吞掉真实变化"
    status: resolved
    resolved_date: "2026-09-12"
    resolution: "创始人采纳 CTO 提议的框架改写（原『5 分钟 vs 30 分钟』时间窗框架作废）：① 技术参数——5 分钟窗口保留但降级为抖动合并器（同一检查器瞬间重复触发），不承担产品语义；② 产品规则——状态驱动：新发现/实质变化立刻推、已认领停止重复转约定节奏、未回应或停滞升级（周报首页 → 标停滞天数 → 给『为什么卡住』诊断）、关闭后复盘沉淀；③ 节奏与格式由老板在首次告警时确认（咨询师做法），技术载体＝监测契约（每客户/每指标：阈值/渠道/节奏/格式/升级规则/责任人，文件化）；④ 政策值：24h 未回应提醒一次、7 天无进展进周报首页、默认周报 1 次一页纸、老板明确『不处理』的问题每周回顾一次。落地判定改为线 8 验收点 8-6（新增）＋ 8-3 收窄为『键稳定』。"

  - id: "D-2"
    title: "第一条做到 100% 的线选哪条？"
    context: "每条线到 100% 都要审计员全量复核（防烂尾）。第一条 100% 线是样板，建议选演示刚需、修复路径最清晰的。"
    options:
      - label: "资本循环（线 10）"
        note: "演示刚需（持续监测叙事）；审计员已给出转绿路径，第一步只需修一行配置"
      - label: "首次诊断（线 06）"
        note: "演示刚需（首诊叙事）；但从未端到端实测，路径最长"
    suggestion:
      label: "资本循环（线 10）"
      reason: "修复路径最短、每步都有审计员给的断点清单，最快立信"
    status: resolved
    resolved_date: "2026-09-12"
    resolution: "创始人采纳 CTO 的『桌面端先行』（覆盖原建议『资本循环』）。依据：桌面端（线 1）8 个验收点中 7 个为 stale（做过、证据过期，重验即可）＋1 个待 K3，是 26 线中唯一『不写新功能就可能到 100%』的线；且其完成定义＝创始人最在意的承诺（双击安装包 → 服务自启 → 开窗即用，Win/Mac 双平台实测）。原建议资本循环经 CTO 核实被高估：8 点中 6 点未开工，含 ERP 连接器等大件。执行顺序：告警推送（80%，补 1 点）→ 桌面端（重验）→ 资本循环 → 首次诊断。"
