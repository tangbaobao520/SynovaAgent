# preconditions.yaml — 前提清单（优先级高于线）
#
# 来源: docs/authority/产品完成度定义与推进总纲-20260918.md §2.2（研究院总纲）
# 语义: 线可以"以后再做"，前提不行 —— 缺一项则**全盘不可用/不可判**，不分哪条线。
# 登记: CTO 2026-09-18 起草；**创始人 2026-09-19 裁定：本清单优先级高于线（生效）**（总纲 §6-3）。
# 维护: CTO 起草 → 创始人确认；新增/移除必须写明"它为什么不能当线"。

schema: preconditions/v1
owner: synova-cto
updated_at: "2026-09-20"
ruled_by: "创始人 2026-09-19：立前提清单且优先级高于线"
priority: "above-lines"

preconditions:
  - id: P-1
    name: "HTTP 代理 / 内网适配"
    why_not_a_line: "客户内网装不上 = 全盘归零，不分哪条线；线可以延后，前提不能"
    evidence_of_gap: "全 src grep HTTPS_PROXY/http_proxy/NO_PROXY/setGlobalDispatcher 零命中；全部出站是裸 fetch（25+ 处）"
    acceptance: "在只允许代理出网的环境跑一次真实 LLM 调用，断言成功且直连会失败"
    order: "第 0 批（与 P0-1 并行）"
    design_precondition: "必须先冻结『出站 HTTP 唯一出口』；否则会出现『有时走代理有时不走』"
    status: dispatched
    card: D821
    self_build_or_borrow: "① 范式复用（DSH dsh-http-proxy 的策略语义）+ ③ 自建（SOCKS5 / 自定义 CA / 配置化）"

  - id: P-2
    name: "不变量机制（运行期断言）"
    why_not_a_line: "它是机制不是能力；价值不在用户感知，而在让『写了没接』无法再发生"
    evidence_of_gap: "src/sentinel/sentinel-events.ts:9-13 有三条命名的 invariant（I1/I2/I3）但全是注释与错误码，无运行期断言/注册表/归属/fail-closed"
    acceptance: "故意破坏一条不变量 → 断言流程**失败**而非静默通过"
    order: "第 1 批（**硬依赖 P0-1 先修**：否则断言在生产中一次都不会被触发）"
    design_precondition: "首批 3 条断言（工具 schema 真的发出去了 / tool 消息与 assistant tool_calls 配对 / 降级信号不被后续成功写入抹掉）"
    status: not_dispatched
    card: null
    self_build_or_borrow: "① 范式复用（DSH dsh-invariants 123 行，净逻辑约 40 行）"

  - id: P-3
    name: "验证基建（CI 跑一次生产入口级对话）"
    why_not_a_line: "它决定 29 条线的『完成』能否被自动判定；是判定手段，不是被判定对象"
    evidence_of_gap: "vitest.config.ts:29-37 在 CI 下 exclude tests/e2e/**（注释 Needs LLM API）"
    acceptance: "CI 里能跑一次生产入口级对话（真实 server + 真实路由 + 假上游抓出站请求体）"
    order: "第 0 批（**所有验收的前提**）"
    status: dispatched
    card: D817
    self_build_or_borrow: "③ 自建（复用我方既有 listen(0)+fetch 范式；零 DSH 依赖）"

# ══════════════════════════════════════════════════════════════════════════════
# D852 复核记录：§6-5 四项产品决定**是否引入新的前提条目**（2026-09-20）
# 结论：**不涉及** —— 不新增 P-4。理由见下（禁沉默跳过）。
# 依据: docs/synova/coordination/创始人裁定表-§6五项-20260920.md §6-5
#       docs/authority/产品完成度定义与推进总纲-20260918.md §2.2（前提清单判据）
# ══════════════════════════════════════════════════════════════════════════════

not_applicable:
  - id: NA-D852
    source: "创始人裁定表-§6五项-20260920.md §6-5（四项产品决定：webhook 方向 / spill 双阈值 / 时间窗粒度 / live-restart 清单）"
    conclusion: "不涉及 —— 四项决定均不引入前提清单条目（不新增 P-4/P-5）"
    criteria_used:
      - "总纲 §2.2 判据①『线可以「以后再做」，前提不行』→ 前提缺失须使**全盘不可用/不可判，不分哪条线**"
      - "总纲 §2.2 判据②『它是**机制**不是能力；价值不在用户感知，而在让断线无法再发生』"
      - "总纲 §2.2 结构自证『§1.1 的 B 段靠 P-2 保证、C 段靠 P-3 保证 —— 这证明这 3 项不该是「线」』"
    per_decision:
      - decision: "① webhook 出站为主 + 入站仅扩展点（线 8）"
        verdict: "不涉及"
        reason: "只约束线 8 内部接口方向与边界（出站点 8-7 / 入站点 8-8），不跨线、不使其他线不可判；且它不是『机制让断线无法再发生』，而是能力本身的形态。"
      - decision: "② spill 双阈值 8,000/32,000 字符可配置（线 4）"
        verdict: "不涉及（但有跨线口径，见 cross_line_contracts CLC-2）"
        reason: "落点归线 4（总纲 §2.1「超长输出/spill → 线 4」），是**参数**不是**机制**；缺它不会使 28 条线不可判，只会使超长输出处理退化（可降级保留 inline）。不满足判据①②。"
      - decision: "③ 时间窗日粒度为主 + 周/月聚合视图（线 3 / D828）"
        verdict: "不涉及（但有跨线口径，见 cross_line_contracts CLC-1）"
        reason: "绑 2 条线（线 3 报告 / 线 27 的 27-2 趋势即 D828），**非『不分哪条线』**；口径不一致导致的是**跨线可比性**下降（趋势与报告数据时点打架），而非全盘不可用/不可判。不满足判据①。"
      - decision: "④ live/restart 清单（线 25）"
        verdict: "不涉及"
        reason: "是线 25 的生效时机分类声明（25-8/25-9），不跨线；其缺位不使其他线不可判。"
    note: "四项决定**均为已有线的能力补强**（总纲 §2.1『11 项 DSH 缺口归线不新开』），不是判定线是否达成的手段，故按 §2.2 的语义不应进前提清单。本记录的目的是**禁止沉默跳过**（派单必做项 4）。"

# 跨线口径约束（**不是前提**，登记以防漂移 M7）
# 语义: 不满足"全盘不可用/不可判"判据 → 不进 preconditions；但多线共同引用同一口径，
#       必须写死"单一来源 + 绑定落点"，否则两处实现会漂移（M7 文档-实现漂移）。
cross_line_contracts:
  - id: CLC-1
    name: "统一时间窗口径（日粒度为主 + 周/月聚合视图）"
    single_source: "创始人裁定表-§6五项-20260920.md §6-5 ③（原文：日粒度为主 + 周/月聚合视图；D828 趋势算法与报告『数据时点』标注都吃这个口径）"
    bound_points: ["product-lines.yaml 3-9（线 3 报告体系）", "product-lines.yaml 27-2（线 27 测量与参数标定 = D828 趋势接线，note 原文『computeTemporalBaseline 现为零生产调用（D828 修）』）"]
    drift_test: "同一区间的周/月聚合值 == 其覆盖日粒度值的一致合成（可复算）；两处任一方另立时间窗即判漂移"
    why_not_a_precondition: "只绑 2 条线 → 不满足总纲 §2.2 判据①『不分哪条线』；且口径是**契约**不是**运行期机制** → 不满足判据②。"
    registered_by: "D852（2026-09-20）"
  - id: CLC-2
    name: "spill 双阈值单一来源（内存 8,000 / 落盘 32,000 字符）"
    single_source: "创始人裁定表-§6五项-20260920.md §6-5 ②（保守起步档；『数字可后期按实测调整』）"
    bound_points: ["product-lines.yaml 4-9（线 4 数据接入）"]
    drift_test: "两阈值必须从**同一配置读取点**读出（对齐 @deepseek-ai/dsh-spill-policy 的 config.maxInlineBytes 读取位）；任一处硬编码即判漂移"
    why_not_a_precondition: "单线落点（线 4）+ 参数非机制；缺它可降级（保留 inline）→ 不满足判据①②。"
    open_question: "**消费方范围待确认**：spill 的消费方可能不止线 4（超长诊断报告路径在线 3）。若实现时确认跨线消费，须升级为 CLC-1 同级的跨线口径（本记录不预设结论，登记备查）。"
    registered_by: "D852（2026-09-20）"
