# Synova Expert Registry v2.0 — D282: 9→7 迁移
# 声明式专家配置。加新专家 = 加一个条目 + 创建目录 → 自动注册。
# 不需要改任何 TypeScript 文件。
#
# v2.0 变更 (2026-07-30):
#   移除: strategy, org, finance, marketing, action, business_model, knowledge
#   新增: capital-cycle, customer-cycle, talent-cycle, finance-structure, competitive-strategy
#   旧目录归档至 expert/_deprecated/

version: 2

experts:
  host:
    enabled: true
    background: false
    model: default
    tools: [route_to_expert, summarize_findings, escalate, query_memory, query_knowledge, get_sentinel_status]

  capital-cycle:
    enabled: true
    background: true
    model: default
    tools: [compute-break-even, compute-dol, compute-capital-allocation, compute-npv, compute-irr]

  customer-cycle:
    enabled: true
    background: true
    model: default
    tools: [compute-competitive-positioning, compute-hhi, compute-customer-value-score, compute-price-elasticity, compute-optimal-price]

  talent-cycle:
    enabled: true
    background: true
    model: default
    tools: [compute-information-flow, compute-incentive-alignment, compute-trust-friction, compute-knowledge-sharing, compute-organizational-learning]

  tech:
    enabled: true
    background: true
    model: default
    tools: [software_ecosystem_scan, connector_blueprint]

  finance-structure:
    enabled: true
    background: false
    model: default
    tools: [compute-interest-coverage, compute-debt-maturity, compute-liquidity-ratio]

  competitive-strategy:
    enabled: true
    background: false
    model: default
    tools: [compute-five-forces, compute-market-share-trend, compute-entrant-threat]
